<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mầm Studio</title>
<meta name="description" content="Mầm Studio làm các ứng dụng nhỏ, gọn cho người Việt.">
<style>
  :root { --bg:#FBF7EE; --fg:#22301F; --muted:#5E6B5A; --line:#E6E0CF; --accent:#3E6B4F; --surface:#FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141A14; --fg:#E8EDE3; --muted:#A3AE9E; --line:#2D382C; --accent:#8FC39F; --surface:#1C241C; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 "Segoe UI", Roboto, system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:30px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 24px; }
  a.card { display:block; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; color:var(--fg); text-decoration:none; margin-bottom:12px; }
  a.card b { display:block; font-size:17px; }
  a.card span { color:var(--accent); font-size:14px; }
  footer { margin-top:32px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Mầm Studio</h1>
  <p>Các ứng dụng nhỏ, gọn cho người Việt.</p>
  <a class="card" href="chi-tieu/chinh-sach/"><b>Mầm: Quản Lý Chi Tiêu</b><span>Chính sách quyền riêng tư</span></a>
  <footer>Liên hệ: dev.mamstudio@gmail.com</footer>
</main>
</body>
</html>
